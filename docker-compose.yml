version: "3.9"

services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: meetingassistant-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: meetingassistant
      POSTGRES_USER: meetingassistant
      POSTGRES_PASSWORD: meetingassistant
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetingassistant -d meetingassistant"]
      interval: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4
    container_name: meetingassistant-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@meetingassistant.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

  redis:
    image: redis:7
    container_name: meetingassistant-redis
    ports:
      - "6379:6379"

  redisinsight:
    image: redis/redisinsight
    container_name: meetingassistant-redisinsight
    ports:
      - "5540:5540"
    depends_on:
      - redis

  minio:
    image: minio/minio
    container_name: meetingassistant-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: .
      dockerfile: MeetingAssistant.Api/Dockerfile
    container_name: meetingassistant-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=meetingassistant;Username=meetingassistant;Password=meetingassistant
      Redis__ConnectionString: redis:6379
      Minio__Endpoint: minio:9000
      Minio__AccessKey: minio
      Minio__SecretKey: minio123
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

volumes:
  postgres_data:
  minio_data: