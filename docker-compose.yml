services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: meetingassistant-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meetingassistant}
      POSTGRES_USER: ${POSTGRES_USER:-meetingassistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetingassistant}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetingassistant -d meetingassistant"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: meetingassistant-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: meetingassistant-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./MeetingAssistant
      dockerfile: Dockerfile
    container_name: meetingassistant-api
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development

      # Database
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:-Host=postgres;Port=5432;Database=meetingassistant;Username=meetingassistant;Password=meetingassistant}

      # JWT
      Jwt__SigningKey: ${Jwt__SigningKey:-dev-secret-key}

      # Redis (optional)
      Redis__ConnectionString: ${Redis__ConnectionString:-redis:6379}

      # AI (optional)
      AI__ApiKey: ${AI__ApiKey:-}
      AI__BaseUrl: ${AI__BaseUrl:-https://api.openai.com}

      # LiveKit (optional)
      LiveKit__ApiKey: ${LiveKit__ApiKey:-}
      LiveKit__ApiSecret: ${LiveKit__ApiSecret:-}
      LiveKit__ServerUrl: ${LiveKit__ServerUrl:-}
      LiveKit__WebhookSecret: ${LiveKit__WebhookSecret:-}

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  livekit:
    image: livekit/livekit-server:latest
    container_name: meetingassistant-livekit
    entrypoint: ["/bin/sh", "-lc"]
    command: ["exec /livekit-server --config-body \"$$LIVEKIT_CONFIG\""]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
        redis:
          address: redis:6379
        keys:
          devkey: devsecret_devsecret_devsecret_32chars
        webhook:
          api_key: devkey
          urls:
            - http://api:8080/api/webhooks/livekit
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: meetingassistant-web
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data: