services:
  meetingassistant-api:
    container_name: meetingassistant-api
    build:
      context: .
      dockerfile: MeetingAssistant/Dockerfile
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=meetingassistant;Username=meetingassistant;Password=meetingassistant
      JwtOptions__Key: secret-dev-key
      HangfireSettings__DashboardUsername: admin
      HangfireSettings__DashboardPassword: admin123
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:18
    container_name: meetingassistant-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: meetingassistant
      POSTGRES_USER: meetingassistant
      POSTGRES_PASSWORD: meetingassistant
    volumes:
      - postgres18_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetingassistant -d meetingassistant"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres18_data:
