services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: meetingassistant-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meetingassistant}
      POSTGRES_USER: ${POSTGRES_USER:-meetingassistant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetingassistant}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetingassistant -d meetingassistant"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: meetingassistant-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

  minio:
    image: minio/minio:latest
    container_name: meetingassistant-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: ./MeetingAssistant
      dockerfile: Dockerfile
    container_name: meetingassistant-api
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development

      # Auth
      Auth__AutoConfirmNewAccounts: ${Auth__AutoConfirmNewAccounts:-true}

      # Database
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:-Host=postgres;Port=5432;Database=meetingassistant;Username=meetingassistant;Password=meetingassistant}

      # JWT
      Jwt__SigningKey: ${Jwt__SigningKey:-dev-secret-key}

      # Coherent AI debug gate for assistant traces and post-processing trace reads
      AiDebug__Enabled: ${AiDebug__Enabled:-false}
      AiDebug__PersistPayloads: ${AiDebug__PersistPayloads:-true}

      # Redis (optional)
      Redis__ConnectionString: ${Redis__ConnectionString:-redis:6379}

      # AI (optional)
      # Generic legacy AI client. Post-meeting LLM jobs and RAG embeddings use OpenAiCompatible__* below.
      AI__ApiKey: ${AI__ApiKey:-local-ai-key}
      AI__BaseUrl: ${AI__BaseUrl:-http://llm:8000}

      # OpenAI-compatible post-meeting providers.
      # Start ../ai_work first so stt/llm resolve on the external ai_work_ai-network.
      OpenAiCompatible__Stt__BaseUrl: ${OpenAiCompatible__Stt__BaseUrl:-http://stt:8000/v1}
      OpenAiCompatible__Stt__ApiKey: ${OpenAiCompatible__Stt__ApiKey:-local-ai-key}
      OpenAiCompatible__Stt__Model: ${OpenAiCompatible__Stt__Model:-whisper-1}
      OpenAiCompatible__Llm__BaseUrl: ${OpenAiCompatible__Llm__BaseUrl:-http://llm:8000/v1}
      OpenAiCompatible__Llm__ApiKey: ${OpenAiCompatible__Llm__ApiKey:-local-ai-key}
      OpenAiCompatible__Llm__Model: ${OpenAiCompatible__Llm__Model:-local}
      # RAG embedding metadata/provider. Use deterministic-test locally until an
      # OpenAI-compatible embeddings service is attached to the Docker network.
      # Production RAG must point at an embeddings endpoint; no ChromaDB/local JSON path is used.
      OpenAiCompatible__Embedding__Provider: ${OpenAiCompatible__Embedding__Provider:-deterministic-test}
      OpenAiCompatible__Embedding__BaseUrl: ${OpenAiCompatible__Embedding__BaseUrl:-}
      OpenAiCompatible__Embedding__ApiKey: ${OpenAiCompatible__Embedding__ApiKey:-local-ai-key}
      OpenAiCompatible__Embedding__Model: ${OpenAiCompatible__Embedding__Model:-deterministic-test-v1}
      OpenAiCompatible__Embedding__Dimension: ${OpenAiCompatible__Embedding__Dimension:-1536}

      # LiveKit (optional)
      LiveKit__ApiKey: ${LiveKit__ApiKey:-}
      LiveKit__ApiSecret: ${LiveKit__ApiSecret:-}
      LiveKit__ServerUrl: ${LiveKit__ServerUrl:-}
      LiveKit__WebhookSecret: ${LiveKit__WebhookSecret:-}
      LiveKit__EgressHost: ${LiveKit__EgressHost:-http://livekit:7880}
      LiveKit__AgentName: ${LiveKit__AgentName:-meeting-assistant}
      LiveKit__AiAssistantDefaultEnabled: ${LiveKit__AiAssistantDefaultEnabled:-true}

    ports:
      - "8080:8080"

    networks:
      - default
      - ai-network

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      livekit:
        condition: service_started

  livekit:
    image: livekit/livekit-server:latest
    container_name: meetingassistant-livekit
    entrypoint: ["/bin/sh", "-lc"]
    command: ["exec /livekit-server --config-body \"$$LIVEKIT_CONFIG\""]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
        redis:
          address: redis:6379
        keys:
          ${LiveKit__ApiKey:-devkey}: ${LiveKit__ApiSecret:-devsecret_devsecret_devsecret_32chars}
        webhook:
          api_key: ${LiveKit__ApiKey:-devkey}
          urls:
            - http://api:8080/api/webhooks/livekit
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  egress:
    image: livekit/egress:latest
    container_name: meetingassistant-egress
    user: "0:0"
    entrypoint: ["/bin/sh", "-lc"]
    command: ["exec egress --config-body \"$$EGRESS_CONFIG_BODY\""]
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    environment:
      EGRESS_CONFIG_BODY: |
        log_level: info
        api_key: ${LiveKit__ApiKey:-devkey}
        api_secret: ${LiveKit__ApiSecret:-devsecret_devsecret_devsecret_32chars}
        ws_url: ws://livekit:7880
        insecure: true
        redis:
          address: redis:6379
        storage:
          s3:
            access_key: ${Storage__AccessKey:-minioadmin}
            secret: ${Storage__SecretKey:-minioadmin}
            endpoint: ${Storage__Endpoint:-http://minio:9000}
            bucket: ${Storage__Bucket:-recordings}
            force_path_style: true
    cap_add:
      - SYS_ADMIN

  # LiveKit Agent (Node.js) — joins rooms as an AI participant.
  # Start ../ai_work first so the external ai_work_ai-network exists and
  # stt/llm/tts service names resolve from this container.
  livekit-agent:
    build:
      context: ../livekit-agent
      dockerfile: Dockerfile
    container_name: meetingassistant-agent
    environment:
      - LIVEKIT_URL=ws://livekit:7880
      - LIVEKIT_API_KEY=${LiveKit__ApiKey:-devkey}
      - LIVEKIT_API_SECRET=${LiveKit__ApiSecret:-devsecret_devsecret_devsecret_32chars}
      - STT_URL=${STT_URL:-http://stt:8000/v1}
      - LLM_URL=${LLM_URL:-http://llm:8000/v1}
      - TTS_URL=${TTS_URL:-http://tts:8000/v1}
      # AI debug tracing: backend metadata must also enable tracing; AI_TRACE_ENABLED=false is a local agent kill switch.
      - BACKEND_AGENT_API_URL=${BACKEND_AGENT_API_URL:-http://api:8080}
      # Backend-owned RAG context retrieval. Auth/config failures fail closed; transient failures continue without RAG.
      - AGENT_RAG_ENABLED=${AGENT_RAG_ENABLED:-true}
      - AGENT_RAG_TOP_K=${AGENT_RAG_TOP_K:-5}
      - AGENT_RAG_TIMEOUT_MS=${AGENT_RAG_TIMEOUT_MS:-2500}
      - AGENT_RAG_MAX_SNIPPETS=${AGENT_RAG_MAX_SNIPPETS:-5}
      - AGENT_RAG_MAX_SNIPPET_CHARS=${AGENT_RAG_MAX_SNIPPET_CHARS:-900}
      - AGENT_RAG_MAX_TOTAL_CONTEXT_CHARS=${AGENT_RAG_MAX_TOTAL_CONTEXT_CHARS:-3000}
      - AI_TRACE_ENABLED=${AI_TRACE_ENABLED:-true}
      - DEPENDENCY_READY_MAX_ATTEMPTS=${DEPENDENCY_READY_MAX_ATTEMPTS:-60}
      - DEPENDENCY_READY_INTERVAL_MS=${DEPENDENCY_READY_INTERVAL_MS:-5000}
      - DEPENDENCY_READY_TIMEOUT_MS=${DEPENDENCY_READY_TIMEOUT_MS:-5000}
      - NODE_ENV=production
    depends_on:
      livekit:
        condition: service_started
    networks:
      - default
      - ai-network
    healthcheck:
      test: ["CMD", "node", "dist/readiness.js", "--once"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: meetingassistant-web
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:

networks:
  ai-network:
    external: true
    name: ai_work_ai-network
